# SapMachine 2026-06-11
#
# Manual approval flow for CI on external (fork) pull requests.
#
# The 'SapMachine GHA Sanity Checks' workflow refuses to run for fork PRs
# whose author is not a SapMachine repository collaborator. This workflow
# gives maintainers two ways to authorize a single revision of such a PR:
#
#   1. Comment '/ok-to-test' on the PR. This workflow verifies the
#      commenter is a repo collaborator (write+), then adds the
#      'ok-to-test' label, reacts to the comment, and re-runs the
#      Sanity Checks workflow for the PR.
#   2. Add the 'ok-to-test' label manually via the GitHub UI. The
#      Sanity Checks workflow already triggers on the 'labeled' event.
#
# When the contributor pushes new commits to the PR, the 'synchronize'
# job below removes the 'ok-to-test' label so that the next revision
# requires fresh maintainer approval. This is the security property that
# makes the label safe: it authorizes only the SHA it was issued against.
#
# This workflow runs on 'pull_request_target' / 'issue_comment' which
# carry repo-write tokens. It NEVER checks out the PR's code; it only
# calls the GitHub API (labels, reactions, run rerun). That is essential
# — running fork code with a write-scoped token would let anyone with a
# fork inject malicious build steps.

name: 'SapMachine PR Authorization'

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write
  issues: write
  actions: write
  contents: read

jobs:

  ok-to-test:
    name: 'Process /ok-to-test comment'
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ok-to-test') }}
    runs-on: ubuntu-24.04
    steps:
      - name: 'Verify commenter is a repository collaborator'
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENTER: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Check the commenter's repo permission. Same gate as the
          # 'authorize' job in main.yml: admin/maintain/write only.
          permission=$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          echo "Commenter '${COMMENTER}' has permission '${permission}' on ${REPO}"
          case "$permission" in
            admin|maintain|write)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              echo "::warning::'/ok-to-test' from non-collaborator '${COMMENTER}' (permission: ${permission}) ignored."
              ;;
          esac

      - name: 'React to comment (authorized)'
        if: steps.verify.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1' >/dev/null

      - name: 'React to comment (rejected)'
        if: steps.verify.outputs.authorized == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='-1' >/dev/null

      - name: 'Add ok-to-test label and re-run Sanity Checks'
        if: steps.verify.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          # Add the label. If it is already there, GitHub returns 200 and
          # this is a no-op.
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=ok-to-test" >/dev/null
          echo "Added 'ok-to-test' label to PR #${PR_NUMBER}."

          # Adding the label triggers a fresh 'pull_request' run via the
          # 'labeled' event in main.yml. But if the label was already
          # present (e.g. someone re-runs '/ok-to-test'), the label add
          # is a no-op and no new run is dispatched. In that case, find
          # the most recent failed Sanity Checks run for this PR's head
          # SHA and re-run its failed jobs.
          PR_HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          echo "PR head SHA: ${PR_HEAD_SHA}"

          RUN_ID=$(gh api "repos/${REPO}/actions/runs?event=pull_request&head_sha=${PR_HEAD_SHA}" \
            --jq '.workflow_runs[] | select(.name=="SapMachine GHA Sanity Checks") | .id' \
            | head -n 1)
          if [[ -n "$RUN_ID" ]]; then
            echo "Re-running failed jobs of Sanity Checks run ${RUN_ID}."
            gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs" || \
              echo "::warning::Re-run-failed call returned non-zero (run may have already succeeded or be in progress)."
          else
            echo "No prior Sanity Checks run for SHA ${PR_HEAD_SHA} — the 'labeled' event will start one."
          fi

  # When new commits land on the PR, drop the 'ok-to-test' label so the
  # next revision must be re-approved. This event fires for both internal
  # and fork PRs; the label add/remove is idempotent, so running it on
  # internal PRs (which never have the label anyway) is harmless.
  drop-label-on-sync:
    name: 'Drop ok-to-test label on new commits'
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}
    runs-on: ubuntu-24.04
    steps:
      - name: 'Remove ok-to-test label'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 'gh api -X DELETE' on a missing label returns 404; treat that
          # as a no-op rather than a failure.
          status=$(gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/ok-to-test" \
            --silent --include 2>&1 | head -n 1 || true)
          echo "Label removal status: ${status}"
          echo "Any prior 'ok-to-test' authorization on PR #${PR_NUMBER} has been revoked due to new commits."
