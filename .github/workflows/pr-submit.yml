# Triggered in two ways:
#   1. Manually via workflow_dispatch by a maintainer (enter PR number).
#   2. Automatically when a repo member with write+ access approves a fork PR.
#
# In both cases it pushes the PR head commit to a submit/<author>/pr-<number>
# branch in this repo, which triggers the main sanity-check workflow with
# access to org secrets and runners.
name: 'Submit Fork PR for CI'

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Pull Request number to submit for CI'
        required: true
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write

jobs:
  submit:
    name: 'Push PR head to submit branch'
    runs-on: ubuntu-24.04
    # For pull_request_review: only act on approvals of fork PRs.
    # For workflow_dispatch: always run.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.review.state == 'approved' &&
        github.event.pull_request.head.repo.full_name != github.repository
      )
    steps:
      - name: 'Check reviewer has write+ access'
        # Anyone can approve a PR. This step ensures only actual repo
        # collaborators with write/maintain/admin can trigger CI.
        # Skipped for workflow_dispatch (maintainer is already trusted).
        if: github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEWER="${{ github.event.review.user.login }}"
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${REVIEWER}/permission" \
            --jq '.permission' 2>/dev/null || echo 'none')
          echo "Reviewer ${REVIEWER} has permission: ${PERMISSION}"
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "maintain" && "$PERMISSION" != "write" ]]; then
            echo "Reviewer does not have write+ access — skipping CI submission."
            exit 1
          fi

      - name: 'Resolve PR number'
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "pr-number=${{ github.event.inputs.pr-number }}" >> $GITHUB_OUTPUT
          else
            echo "pr-number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: 'Fetch PR metadata'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_json=$(gh api repos/${{ github.repository }}/pulls/${{ steps.resolve.outputs.pr-number }})
          head_sha=$(echo "$pr_json" | jq -r '.head.sha')
          head_repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')
          author=$(echo "$pr_json" | jq -r '.user.login')
          echo "head-sha=$head_sha" >> $GITHUB_OUTPUT
          echo "head-repo=$head_repo" >> $GITHUB_OUTPUT
          echo "author=$author" >> $GITHUB_OUTPUT

      - name: 'Checkout the PR head'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.head-repo }}
          ref: ${{ steps.pr.outputs.head-sha }}
          fetch-depth: 1

      - name: 'Push to submit branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUBMIT_BRANCH="submit/${{ steps.pr.outputs.author }}/pr-${{ steps.resolve.outputs.pr-number }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:refs/heads/${SUBMIT_BRANCH}" --force

      - name: 'Comment on PR'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUBMIT_BRANCH="submit/${{ steps.pr.outputs.author }}/pr-${{ steps.resolve.outputs.pr-number }}"
          ACTIONS_URL="https://github.com/${{ github.repository }}/actions?query=branch%3A${SUBMIT_BRANCH}"
          gh pr comment ${{ steps.resolve.outputs.pr-number }} \
            --repo ${{ github.repository }} \
            --body "CI has been triggered for this PR on branch \`${SUBMIT_BRANCH}\`. [View runs](${ACTIONS_URL})"
